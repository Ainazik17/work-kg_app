<!doctype html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
		/>
		<title>Work KG</title>

		<!-- Подключаем скрипт ТГ первым делом -->
		<script src="https://telegram.org/js/telegram-web-app.js"></script>
		<script src="https://cdn.tailwindcss.com"></script>

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap"
			rel="stylesheet"
		/>

		<style>
			:root {

				/* Динамические отступы (Safe Areas) */
				--sat: env(safe-area-inset-top);
				--sab: env(safe-area-inset-bottom);
				--sar: env(safe-area-inset-right);
				--sal: env(safe-area-inset-left);
			}

			* {
				box-sizing: border-box;
				/* Убираем синее выделение при нажатии на мобилках */
				-webkit-tap-highlight-color: transparent;
			}

			body {
				font-family: Onest, Inter, system-ui, sans-serif;
				background-color: #f6f5f2;
				color: #0e0e10;
				margin: 0;
				padding: 0;
				width: 100%;
				min-height: 100vh;

				/* Делаем как в нативном приложении */
				overflow-x: hidden;
				-webkit-user-select: none; /* Запрет выделения текста */
				user-select: none;

				/* Блокируем стандартный скролл-эффект "оттягивания" всей страницы */
				overscroll-behavior-y: none;
			}

			/* Старые классы темы теперь смотрят на токены дизайна (src/styles/tokens.css) */
			.bg-main {
				background-color: var(--bg);
			}
			.bg-secondary {
				background-color: var(--card);
			}
			.text-main {
				color: var(--ink);
			}
			.text-hint {
				color: var(--muted);
			}

			/* Нативная прокрутка внутри блоков */
			.ios-scroll {
				-webkit-overflow-scrolling: touch;
				overflow-y: auto;
			}

			.no-scrollbar::-webkit-scrollbar {
				display: none;
			}
			.no-scrollbar {
				-ms-overflow-style: none;
				scrollbar-width: none;
			}

			.brand-gradient {
				background: linear-gradient(140deg, #2a0a09 0%, #b4161b 100%);
			}

			/* Анимация Apple-style */
			.active-scale:active {
				transform: scale(0.97);
				transition: transform 0.1s ease-out;
			}

			/* Хелперы для безопасных зон (используй их в верстке) */
			.pt-safe {
				padding-top: var(--sat);
			}
			.pb-safe {
				padding-bottom: var(--sab);
			}

			/* Фикс для клавиатуры (чтобы контент не прыгал) */
			#root {
				display: flex;
				flex-direction: column;
				min-height: 100vh;
			}
		</style>
	</head>

	<!-- Важно: убрал bg-slate-50, чтобы не перебивать тему ТГ -->
	<body class="antialiased transition-colors duration-200">
		<div id="root"></div>

		<script type="module" src="/index.tsx"></script>

		<script>
			// Небольшой хак для моментальной синхронизации темы
			const tg = window.Telegram.WebApp
			tg.ready()
			tg.expand()

			// Если ТГ поддерживает установку цвета заголовка (v6.1+)
			if (tg.setHeaderColor) {
				tg.setHeaderColor('#F6F5F2')
				if (tg.setBackgroundColor) tg.setBackgroundColor('#F6F5F2')
			}
		</script>
	</body>
</html>
